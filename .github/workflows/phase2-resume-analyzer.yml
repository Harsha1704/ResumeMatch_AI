name: Phase 2 Resume Analyzer

on:
  push:
    branches:
      - deploy/vercel-render-free
    paths:
      - "app.py"
      - "src/analysis/**"
      - "src/preprocessing/**"
      - "templates/analyze.html"
      - "static/js/analyzer.js"
      - "tests/test_analysis_integration.py"
      - "tests/test_resume_parser.py"
      - "tests/test_experience_and_projects.py"
      - "tests/test_real_resume_cases.py"
      - "tests/test_skill_extraction_eval.py"
      - ".github/workflows/phase2-resume-analyzer.yml"
  pull_request:
    branches:
      - deploy/vercel-render-free

permissions:
  contents: read

jobs:
  resume-analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyarrow
      - name: Run Resume Analyzer regression suite
        run: |
          pytest -q tests/test_analysis_integration.py tests/test_resume_parser.py tests/test_experience_and_projects.py tests/test_real_resume_cases.py tests/test_skill_extraction_eval.py
